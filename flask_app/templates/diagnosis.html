{% extends "base.html" %}
{% block content %}
<h1>かんたん診断</h1>

<form method="post">
  <p>Q1 都道府県<br>
    <select name="prefecture">
      <option value="">選択してください</option>
      {% for code, name in prefectures.items() if code != "00" %}
      <option value="{{ code }}">{{ name }}</option>
      {% endfor %}
    </select>
  </p>

  <p>Q2 子どもの人数<br>
    <label><input type="radio" name="children_count" value="0">0人</label>
    <label><input type="radio" name="children_count" value="1">1人</label>
    <label><input type="radio" name="children_count" value="2">2人</label>
    <label><input type="radio" name="children_count" value="3">3人</label>
    <label><input type="radio" name="children_count" value="4">4人以上</label>
  </p>

  <p>Q3 世帯年収<br>
    <label><input type="radio" name="income" value="1">300万円未満</label>
    <label><input type="radio" name="income" value="2">300〜500万円</label>
    <label><input type="radio" name="income" value="3">500〜800万円</label>
    <label><input type="radio" name="income" value="4">800万円以上</label>
    <label><input type="radio" name="income" value="5">わからない</label>
  </p>

  <p>Q4 ひとり親世帯ですか<br>
    <label><input type="radio" name="is_single" value="1">はい</label>
    <label><input type="radio" name="is_single" value="0">いいえ</label>
  </p>

  <button>この内容で診断する</button>
</form>
{% endblock %}
