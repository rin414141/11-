
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぽけっと手当｜新規登録</title>
  <style>
    :root {
      --green: #08786f;
      --green-dark: #05665f;
      --mint: #e7f3ef;
      --page: #f4f7f3;
      --text: #263b38;
      --muted: #788783;
      --line: #dce5e1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 14px;
      background: #eef2ef;
      color: var(--text);
      font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    }

    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 760px;
      margin: 0 auto;
      background: var(--page);
      border: 1px solid #d8e0dc;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(28,65,55,.10);
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .back {
      color: var(--green);
      text-decoration: none;
      font-size: 25px;
    }

    .brand {
      color: var(--green);
      font-size: 19px;
      font-weight: 800;
    }

    main {
      padding: 22px 20px 18px;
      flex: 1;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 4px;
      background: #e8eeeb;
      border-radius: 30px;
      margin-bottom: 16px;
    }

    .tab {
      border: 0;
      background: transparent;
      border-radius: 24px;
      padding: 12px 8px;
      color: #71807b;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: #fff;
      color: var(--green);
      box-shadow: 0 2px 7px rgba(20,60,50,.08);
    }

    .notice {
      margin: 0 0 20px;
      padding: 13px 14px;
      border-radius: 12px;
      background: var(--mint);
      color: #47736b;
      font-size: 12px;
      line-height: 1.7;
    }

    .field { margin-bottom: 16px; }

    .field-label {
      display: block;
      margin: 0 0 7px 2px;
      font-size: 13px;
      font-weight: 700;
    }

    .required {
      color: #d45b51;
      font-size: 11px;
      margin-left: 5px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #d3ded9;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8,120,111,.10);
    }

    input::placeholder { color: #a8b2ae; }

    .password-wrap { position: relative; }

    .password-wrap input { padding-right: 58px; }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .help {
      margin: 6px 2px 0;
      color: var(--muted);
      font-size: 11px;
    }

    .options {
      margin-top: 20px;
      padding: 13px 12px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #edf1ee;
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 3px 0 13px;
      font-size: 11px;
      line-height: 1.65;
      cursor: pointer;
    }

    .check-row:last-child { margin-bottom: 2px; }

    .check-row input {
      width: 16px;
      height: 16px;
      margin: 1px 0 0;
      accent-color: var(--green);
      flex: 0 0 auto;
    }

    .check-row a {
      color: var(--green);
      text-decoration: underline;
    }

    .error {
      display: none;
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff0ee;
      color: #b4473e;
      font-size: 12px;
      line-height: 1.6;
    }

    .bottom {
      padding: 16px 20px 20px;
      background: var(--page);
    }

    .submit {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 28px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(8,120,111,.15);
    }

    .submit:hover { background: var(--green-dark); }

    .bottom-note {
      margin: 9px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    .forgot {
      display: block;
      margin: 14px 0 0;
      text-align: center;
      color: var(--green);
      font-size: 12px;
      text-decoration: underline;
    }

    .login-only { display: none; }

    @media (max-width: 420px) {
      body { padding: 0; background: var(--page); }
      .phone {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
<div class="phone">

  <header>
    <a class="back" href="#" aria-label="戻る">‹</a>
    <div class="brand">ぽけっと手当</div>
  </header>

  <main>

    <div class="tabs">
      <button class="tab active" id="signupTab" type="button">
        新規登録
      </button>
      <button class="tab" id="loginTab" type="button">
        ログイン
      </button>
    </div>

    <p class="notice" id="notice">
      ☆保存した情報と、さっきの診断条件がそのまま引き継がれます
    </p>

    <form id="authForm" novalidate>

      <div class="field">
        <label class="field-label" for="email">
          メールアドレス
          <span class="required">必須</span>
        </label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="example@mail.com"
          autocomplete="email"
          required>
      </div>

      <div class="field">
        <label class="field-label" for="password">
          パスワード
          <span class="required">必須</span>
        </label>

        <div class="password-wrap">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="英字と数字を含む8文字以上"
            minlength="8"
            maxlength="32"
            autocomplete="new-password"
            required>

          <button
            class="show-password"
            id="togglePassword"
            type="button">
            表示
          </button>
        </div>

        <p class="help" id="passwordHelp">
          半角英字・数字を含む8〜32文字で設定してください。
        </p>
      </div>

      <section class="options" id="signupOptions">

        <label class="check-row">
          <input type="checkbox" id="terms" required>
          <span>
            <a href="#">利用規約</a>に同意する
            <span class="required">（必須）</span>
          </span>
        </label>

        <label class="check-row">
          <input type="checkbox" id="notify">
          <span>締切のお知らせをメールで受け取る</span>
        </label>

        <label class="check-row">
          <input type="checkbox" id="partner">
          <span>提携サービスの案内を受け取る（任意）</span>
        </label>

      </section>

      <a class="forgot login-only" id="forgotLink" href="#">
        パスワードを忘れた方
      </a>

      <p class="error" id="errorMessage" role="alert"></p>

    </form>
  </main>

  <div class="bottom">
    <button
      class="submit"
      id="submitButton"
      type="submit"
      form="authForm">
      登録して保存する
    </button>

    <p class="bottom-note" id="bottomNote">
      氏名や住所の入力はいりません
    </p>
  </div>

</div>

<script>
  const signupTab = document.getElementById('signupTab');
  const loginTab = document.getElementById('loginTab');
  const signupOptions = document.getElementById('signupOptions');
  const notice = document.getElementById('notice');
  const submitButton = document.getElementById('submitButton');
  const bottomNote = document.getElementById('bottomNote');
  const password = document.getElementById('password');
  const passwordHelp = document.getElementById('passwordHelp');
  const errorMessage = document.getElementById('errorMessage');
  const forgotLink = document.getElementById('forgotLink');

  let mode = 'signup';

  // 新規登録・ログインの切り替え
  function setMode(nextMode) {
    mode = nextMode;

    const isSignup = mode === 'signup';

    signupTab.classList.toggle('active', isSignup);
    loginTab.classList.toggle('active', !isSignup);

    signupOptions.style.display = isSignup ? 'block' : 'none';

    document.querySelectorAll('.login-only').forEach(el => {
      el.style.display = isSignup ? 'none' : 'block';
    });

    notice.textContent = isSignup
      ? '☆保存した情報と、さっきの診断条件がそのまま引き継がれます'
      : '登録済みのメールアドレスとパスワードを入力してください。';

    submitButton.textContent = isSignup
      ? '登録して保存する'
      : 'ログイン';

    bottomNote.textContent = isSignup
      ? '氏名や住所の入力はいりません'
      : 'ご登録のアカウントでログインします';

    password.autocomplete = isSignup
      ? 'new-password'
      : 'current-password';

    passwordHelp.textContent = isSignup
      ? '半角英字・数字を含む8〜32文字で設定してください。'
      : '登録時に設定したパスワードを入力してください。';

    errorMessage.style.display = 'none';
  }

  signupTab.addEventListener('click', () => setMode('signup'));
  loginTab.addEventListener('click', () => setMode('login'));

  // パスワード表示・非表示
  document.getElementById('togglePassword')
    .addEventListener('click', function() {

      const showing = password.type === 'text';

      password.type = showing ? 'password' : 'text';
      this.textContent = showing ? '表示' : '隠す';
    });

  // 入力チェック
  document.getElementById('authForm')
    .addEventListener('submit', function(event) {

      event.preventDefault();

      errorMessage.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const pass = password.value;

      let message = '';

      if (!email) {
        message = 'メールアドレスを入力してください。';

      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        message = 'メールアドレスの形式を確認してください。';

      } else if (!pass) {
        message = 'パスワードを入力してください。';

      } else if (
        mode === 'signup' &&
        (
          pass.length < 8 ||
          pass.length > 32 ||
          !/[A-Za-z]/.test(pass) ||
          !/[0-9]/.test(pass)
        )
      ) {
        message = 'パスワードは半角英字と数字を含む8〜32文字で入力してください。';

      } else if (
        mode === 'signup' &&
        !document.getElementById('terms').checked
      ) {
        message = '利用規約への同意が必要です。';
      }

      if (message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        return;
      }

      // Flaskとの接続前の仮処理
      alert(
        mode === 'signup'
          ? '入力チェックが完了しました。'
          : '入力チェックが完了しました。'
      );
    });

  // パスワード再設定
  forgotLink.addEventListener('click', function(event) {
    event.preventDefault();
    alert('パスワード再設定ページへのリンクを設定してください。');
  });

</script>

</body>
</html>
